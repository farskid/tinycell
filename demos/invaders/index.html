<div class="wrap">
  <div class="top">
    <a class="back" href="../../">TinyGM</a>
    <div class="back">Canvas · ANSI</div>
  </div>
  <h1>Invaders</h1>
  <p class="lede">
    One <code>createSpaceInvadersApp</code>. The canvas below is the web host.
    The terminal host is the third sample.
  </p>
  <div class="layout">
    <div class="stage">
      <article class="machine invaders">
        <div class="bar"><span><i class="dot"></i><b>Invaders</b></span><span>48×34</span></div>
        <div class="screen" data-w="768" data-h="544">
          <iframe src="../../games/space-invaders/" title="Space Invaders" tabindex="0"></iframe>
          <button type="button" class="veil"><span>Play</span></button>
        </div>
        <p class="keys"><kbd>enter</kbd> start · <kbd>arrows</kbd> move · <kbd>space</kbd> fire</p>
      </article>
    </div>
    <div class="samples" id="samples"></div>
  </div>
</div>
