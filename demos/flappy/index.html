<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flappy · TinyCell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,560&display=swap"
  rel="stylesheet" />
<link rel="stylesheet" href="../demo.css" />

<div class="wrap">
  <div class="top">
    <a class="back" href="../../">TinyCell</a>
    <div class="back">Canvas · ANSI</div>
  </div>
  <h1>Flappy</h1>
  <p class="lede">
    One <code>createFlappyApp</code>. The bird and the pipes are cells. Play it
    here. The tabs are the core, the web host, and the terminal host.
  </p>
  <div class="layout">
    <div class="stage">
      <article class="machine flappy">
        <div class="bar"><span><i class="dot"></i><b>Flappy</b></span><span>40×24</span></div>
        <div class="screen" data-w="640" data-h="384">
          <iframe src="../../games/flappy/" title="Flappy" tabindex="0"></iframe>
          <button type="button" class="veil"><span>Play</span></button>
        </div>
        <p class="keys"><kbd>space</kbd> flap</p>
      </article>
    </div>
    <div class="samples" id="samples"></div>
  </div>
</div>
<script type="module" src="./main.ts"></script>
