<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake · TinyCell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,560&display=swap"
  rel="stylesheet" />

<div class="wrap">
  <div class="top">
    <a class="back" href="../../">TinyCell</a>
    <div class="back">Canvas · ANSI</div>
  </div>
  <h1>Snake</h1>
  <p class="lede">
    One <code>createSnakeApp</code>. Play it here. The tabs are the core, the
    web host, and the terminal host.
  </p>
  <div class="layout">
    <div class="stage">
      <article class="machine">
        <div class="bar"><span><i class="dot"></i><b>Snake</b></span><span>32×39</span></div>
        <div class="screen" data-w="512" data-h="624">
          <iframe src="../../games/snake/" title="Snake" tabindex="0"></iframe>
          <button type="button" class="veil"><span>Play</span></button>
        </div>
        <p class="keys">
          <kbd>arrows</kbd> start · <kbd>tab</kbd> feat · <kbd>space</kbd> cycle · <kbd>enter</kbd> retry
        </p>
      </article>
    </div>
    <div class="samples" id="samples"></div>
  </div>
</div>
